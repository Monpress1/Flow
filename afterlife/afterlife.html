<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AFTERLIFE – Milestone 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:rgba(20,18,14,.82);--fg:#efe6d2;--gold:#e8b84a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#15120e;font-family:system-ui,sans-serif;color:var(--fg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.p{position:absolute;background:var(--bg);border:1px solid #5a4a30;border-radius:8px;padding:6px 10px;font-size:13px;backdrop-filter:blur(3px)}
#top{top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;white-space:nowrap}
#logo{left:8px;top:calc(env(safe-area-inset-top,0px) + 6px);font-weight:900;letter-spacing:3px;color:var(--gold);font-size:16px}
#obj{left:8px;top:calc(env(safe-area-inset-top,0px) + 40px);max-width:170px}
#obj h4{margin:0 0 3px;color:var(--gold);font-size:12px;cursor:pointer}
#side{left:8px;top:50%;transform:translateY(-35%);display:flex;flex-direction:column;gap:4px;padding:4px}
button{background:#3a2f1e;color:var(--fg);border:1px solid #6b5836;border-radius:6px;padding:6px 8px;font-size:12px;cursor:pointer}
button:hover,button.on{background:#6b5836}
#mm{right:8px;top:calc(env(safe-area-inset-top,0px) + 44px);padding:3px}
#mm canvas{width:110px;height:110px;border-radius:5px}
#cards{left:70px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:4px;max-width:calc(100% - 80px);overflow-x:auto}
#cards button{min-width:62px}
#info{right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-width:230px;display:none}
#info b{color:var(--gold)}
#toast{left:50%;bottom:90px;transform:translateX(-50%);display:none;max-width:80%;text-align:center}
.sp{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px)}
@media (max-height:560px){
.p{padding:2px 5px;font-size:10px;border-radius:5px}button{padding:2px 6px;font-size:10px}
#top{top:calc(env(safe-area-inset-top,0px) + 2px);gap:6px}#logo{display:none}
#obj{top:30px;left:4px;max-width:125px}#obj small{display:none}#obj h4{font-size:10px}
#side{left:4px;top:auto;bottom:30px;transform:none;flex-direction:row;padding:2px}
#cards{left:4px;bottom:2px;max-width:calc(100% - 8px);gap:2px;padding:2px}#cards button{min-width:0;white-space:nowrap;padding:2px 4px}
#mm{top:30px;right:4px}#mm canvas{width:72px;height:72px}
#info{bottom:56px;right:4px;max-width:170px;font-size:10px}
#bpan{top:30px!important;left:4px!important;bottom:auto;max-height:55%;overflow-y:auto;flex-direction:column}
#pbar{top:30px!important}#toast{bottom:62px}
}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script></head><body>
<canvas id="c"></canvas>
<div class="p" id="logo">AFTERLIFE</div>
<div class="p" id="top">
 <span><i class="fa-solid fa-bowl-food"></i> <b id="rf">120</b></span><span><i class="fa-solid fa-droplet"></i> <b id="rw">95</b></span><span><i class="fa-solid fa-tree"></i> <b id="rd">200</b></span><span><i class="fa-solid fa-gear"></i> <b id="rm">75</b></span>
 <span><i class="fa-solid fa-users"></i> <b id="pop">10</b></span><span id="clock">Day 1 08:00</span>
 <button id="bp"><i class="fa-solid fa-pause"></i></button><button id="b1" class="on"><i class="fa-solid fa-play"></i></button><button id="b2"><i class="fa-solid fa-forward"></i></button><button id="b3"><i class="fa-solid fa-forward-fast"></i></button>
</div>
<div class="p" id="obj"><h4 id="oh">▾ Objective</h4><div id="ob">Explore: click a building, drag to pan, wheel/pinch to zoom, Q/E rotate.<br><small>Milestone 1: world only. Stockpile is fixed until M3.</small></div></div>
<div class="p" id="side"><button data-m="Build|4"><i class="fa-solid fa-hammer"></i> Build</button><button data-m="Research|6"><i class="fa-solid fa-flask"></i> Research</button><button data-m="Manage|5"><i class="fa-solid fa-users"></i> Manage</button><button data-m="Events|6"><i class="fa-solid fa-calendar-days"></i> Events</button></div>
<div class="p" id="mm"><canvas id="mmc" width="110" height="110"></canvas></div>
<div class="p" id="cards"></div>
<div class="p" id="info"></div>
<div class="p" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const R=(a,b)=>a+(b-a)*rnd();
const cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8a9a8e);scene.fog=new THREE.Fog(0x8a9a8e,230,470);
const cam=new THREE.PerspectiveCamera(35,1,1,900);
const hemi=new THREE.HemisphereLight(0xbfd0e0,0x4a3a22,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,1.1);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=sc.bottom=-50;sc.right=sc.top=50;sc.near=1;sc.far=200;
scene.add(sun,sun.target);
const MAT={};const M=(c,o={})=>MAT[c+JSON.stringify(o)]||(MAT[c+JSON.stringify(o)]=new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:1},o)));
function box(w,h,d,m,x,y,z,p){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p&&p.add(o);return o}
function cyl(rt,rb,h,s,m,x,y,z,p){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p&&p.add(o);return o}

// ---------- terrain ----------
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const nz=(x,z)=>Math.sin(x*.11)*Math.cos(z*.13)+.5*Math.sin(x*.27+z*.21)+.25*Math.sin(x*.6-z*.5);
const ROADZ=-26;
const H=(x,z)=>nz(x,z)*1.6*ss(26,55,Math.hypot(x,z))*ss(7,14,Math.abs(z-ROADZ))+.0;
{const g=new THREE.PlaneGeometry(560,560,200,200);g.rotateX(-Math.PI/2);
 const p=g.attributes.position,col=[];const c=new THREE.Color();
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,H(x,z));
  const n=nz(x*1.7+9,z*1.7)*.5+.5,r=Math.hypot(x,z);
  const dirt=Math.max(ss(20,5,r)*.9,ss(.55,.9,n)*.5);
  c.setRGB(.28+n*.08,.36+n*.08,.17).lerp(new THREE.Color(.45,.33,.2),dirt);col.push(c.r,c.g,c.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1}));m.receiveShadow=true;scene.add(m)}
// road
{const road=box(560,.12,7,M(0x3a3d40),0,.06,ROADZ,scene);road.castShadow=false;
 for(let x=-270;x<270;x+=8){const l=box(3,.05,.25,M(0xcfc9a8),x,.14,ROADZ,scene);l.castShadow=false}
 box(560,.2,.4,M(0x777),0,.1,ROADZ+4,scene);box(560,.2,.4,M(0x777),0,.1,ROADZ-4,scene)}

// ---------- instanced vegetation ----------
const free=(x,z)=>Math.hypot(x,z)>24&&Math.abs(z-ROADZ)>6;
const pts=[];while(pts.length<1300){const x=R(-230,230),z=R(-230,230);if(free(x,z))pts.push([x,z,rnd()])}
const pine=pts.filter(p=>p[2]<.6),round=pts.filter(p=>p[2]>=.6);
function inst(geo,mat,list,f){const im=new THREE.InstancedMesh(geo,mat,list.length);im.castShadow=true;const d=new THREE.Object3D();
 list.forEach((p,i)=>{const s=.8+rnd()*.7;d.position.set(p[0],H(p[0],p[1])+f.y*s,p[1]);d.scale.set(s,s,s);d.rotation.y=rnd()*6;d.updateMatrix();im.setMatrixAt(i,d.matrix)});scene.add(im)}
inst(new THREE.CylinderGeometry(.25,.35,2,5),M(0x4a3420),pts,{y:1});
inst(new THREE.ConeGeometry(1.7,3.4,6),M(0x2c4a2c),pine,{y:3.3});
inst(new THREE.ConeGeometry(1.3,2.8,6),M(0x35592f),pine,{y:5.1});
inst(new THREE.IcosahedronGeometry(1.9,0),M(0x58742f),round,{y:3.6});
const bush=[];for(let i=0;i<450;i++){const x=R(-200,200),z=R(-200,200);if(free(x,z))bush.push([x,z])}
inst(new THREE.IcosahedronGeometry(.7,0),M(0x4c6a2a),bush,{y:.3});

// ---------- selectable things ----------
const pick=[];
function reg(g,name,desc,x,z,rot=0){g.position.set(x,H(x,z),z);g.rotation.y=rot;g.userData={name,desc};scene.add(g);pick.push(g);return g}
function rock(x,z,s){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),M(0x7d7f7c));m.scale.set(1.2,.8,1);m.position.y=s*.5;m.castShadow=m.receiveShadow=true;g.add(m);
 return reg(g,'Rock outcrop','Future metal / stone gathering site (not gatherable yet).',x,z,rnd()*6)}
function shelter(x,z,rot,roof){const g=new THREE.Group();
 box(5,2.6,4,M(0x6b4a2c),0,1.3,0,g);box(1,1.7,.1,M(0x2a1c10),0,.9,2.03,g);box(1,.9,.1,M(0xf0c060,{emissive:0x553300}),1.6,1.5,2.03,g);
 const r=box(5.8,.2,2.8,M(roof),0,3.1,1.0,g);r.rotation.x=.5;const r2=box(5.8,.2,2.8,M(roof),0,3.1,-1.0,g);r2.rotation.x=-.5;
 return reg(g,'Shelter','Houses survivors. Resting & capacity arrive in Milestone 2–4.',x,z,rot)}
shelter(-9,-7,.1,0x8d8f8a);shelter(9,-8,-.2,0x6f7f90);shelter(-11,8,.5,0x8d8f8a);shelter(10,10,-.6,0x7a5a3a);
// campfire
const fireG=new THREE.Group();for(let i=0;i<6;i++){const l=cyl(.1,.1,1.2,5,M(0x3a2410),Math.cos(i)*.5,.25,Math.sin(i)*.5,fireG);l.rotation.z=1.2;l.rotation.y=-i}
const flame=new THREE.Mesh(new THREE.ConeGeometry(.45,1.3,6),new THREE.MeshBasicMaterial({color:0xffa030}));flame.position.y=.8;fireG.add(flame);
reg(fireG,'Campfire','Social hub. Warmth & morale effects arrive in Milestone 5.',0,0);
const fl=new THREE.PointLight(0xff8a30,1.6,22);fl.position.set(0,2,0);scene.add(fl);
// watchtower
{const g=new THREE.Group();[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(.3,8,.3,M(0x5a3d22),a*1.3,4,b*1.3,g));
 box(4,.3,4,M(0x6b4a2c),0,8,0,g);box(3.4,1,.2,M(0x5a3d22),0,8.6,1.7,g);box(3.4,1,.2,M(0x5a3d22),0,8.6,-1.7,g);
 const rf=cyl(0,3.2,1.2,4,M(0x888a88),0,10,0,g);rf.rotation.y=.78;
 reg(g,'Watchtower','Will extend vision and warn of threats (Milestone 6).',17,-4)}
// workshop + storage
{const g=new THREE.Group();box(6,2.8,5,M(0x5a4430),0,1.4,0,g);box(6.6,.25,5.6,M(0x8a8c88),0,3,0,g);box(1.2,1,1.2,M(0x7a5a30),2,.5,3.1,g);
 reg(g,'Workshop','Crafting & upgrades (Milestone 4).',-1,15,.1)}
{const g=new THREE.Group();box(4,2.2,4,M(0x4a5a6a),0,1.1,0,g);box(4.4,.2,4.4,M(0x2c4a7a),0,2.3,0,g);
 reg(g,'Storage (tarp roof)','Will cap and hold resources (Milestone 3–4).',16,6,.4)}
// farm plot
{const g=new THREE.Group();box(10,.2,8,M(0x4a3420),0,.1,0,g);
 for(let i=-3;i<=3;i++)box(9,.35,.9,M(0x3f7a2a),0,.3,i*1.05,g);
 [[-5.2,0,.2,8.4],[5.2,0,.2,8.4]].forEach(f=>box(f[2],.9,f[3],M(0x6b4a2c),f[0],.5,f[1],g));
 reg(g,'Farm plot (placeholder)','Visual only for now. Real farming comes in Milestone 3.',-16,-2,.05)}
// rocks
for(let i=0;i<34;i++){let x=R(-160,160),z=R(-160,160);if(free(x,z))rock(x,z,R(1.2,3))}
// ruins
function windowsTex(){const c=document.createElement('canvas');c.width=64;c.height=128;const x=c.getContext('2d');x.fillStyle='#7d8590';x.fillRect(0,0,64,128);
 for(let i=0;i<4;i++)for(let j=0;j<8;j++){x.fillStyle=rnd()<.15?'#8aa':'#1b2026';x.fillRect(6+i*15,6+j*15,9,10)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
function ruin(x,z,w,h,d,rot){const g=new THREE.Group();const t=windowsTex();t.repeat.set(Math.ceil(w/6),Math.ceil(h/10));
 const m=M(0xffffff,{map:t});box(w,h,d,m,0,h/2,0,g);
 for(let i=0;i<4;i++)box(R(1,3),R(.5,1.5),R(1,3),M(0x666a6e),R(-w,w)*.8,.5,R(-d,d)*.9+d,g);
 box(w*.5,2,d*.6,M(0x585c60),w*.2,h+1,0,g);
 return reg(g,'Ruined building','Abandoned structure. Exploration & loot arrive in Milestone 6.',x,z,rot)}
ruin(-30,-48,14,22,10,.2);ruin(8,-52,10,14,9,0);ruin(40,-40,12,9,10,.5);ruin(-55,20,10,12,12,.3);ruin(52,25,12,16,9,-.4);ruin(30,55,9,8,9,0);
// bus & car on road
{const g=new THREE.Group();box(10,3,3,M(0x6a7a80),0,2,0,g);box(10.1,.5,3.1,M(0x333),0,.9,0,g);box(9,1,3.1,M(0x1b2026),0,2.6,0,g);
 reg(g,'Abandoned bus','Wreck. Salvageable metal in a later milestone.',-14,ROADZ-1.5,.05)}
{const g=new THREE.Group();box(4,1,2,M(0x8a4a2a),0,.9,0,g);box(2,.9,1.8,M(0x333),-.2,1.8,0,g);
 reg(g,'Wrecked car','Wreck. Salvageable later.',20,ROADZ+1.5,-.1)}

// ---------- survivors (visual wandering only; needs/AI = Milestone 2) ----------
const NAMES=['Daniel','Sarah','Mike','Emma','James','Lena','Omar','Rosa','Kofi','Ivy'];
const AGES=[34,29,41,26,38,22,45,31,28,19];
const SURV=[];
NAMES.forEach((n,i)=>{const g=new THREE.Group();const sh=[0x6a4a3a,0x3a4a5a,0x4a5a3a,0x7a3a3a,0x555][i%5];
 box(.55,.8,.3,M(sh),0,1.1,0,g);box(.2,.7,.2,M(0x2a3a52),-.14,.4,0,g);box(.2,.7,.2,M(0x2a3a52),.14,.4,0,g);
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),M(0xc89a74));hd.position.y=1.72;hd.castShadow=true;g.add(hd);
 const a=rnd()*6,r=R(3,12);g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData={name:n,desc:'Survivor, age '+AGES[i]+'. Needs, jobs and AI arrive in Milestone 2.',tgt:g.position.clone(),ph:rnd()*6};
 scene.add(g);pick.push(g);SURV.push(g)});
SURV.forEach(g=>{g.userData.tgt=g.position.clone()});
$('cards').innerHTML=NAMES.slice(0,5).map((n,i)=>`<button data-s="${i}"><i class="fa-solid fa-face-smile"></i> ${n}</button>`).join('');
$('cards').onclick=e=>{const i=e.target.dataset.s;if(i!=null){sel(SURV[i]);tgt.copy(SURV[i].position)}};

// ---------- selection ----------
const ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.5,24).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xe8b84a,side:2,fog:false}));ring.visible=false;scene.add(ring);
let selObj=null;
function sel(o){selObj=o;const i=$('info');if(!o){i.style.display='none';ring.visible=false;return}
 i.style.display='block';i.innerHTML='<b>'+o.userData.name+'</b><br>'+o.userData.desc;ring.visible=true;
 const s=o.userData.tgt?.7:Math.max(1.3,new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).x/3);ring.scale.setScalar(s)}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
document.querySelectorAll('#side button').forEach(b=>b.onclick=()=>{const[n,m]=b.dataset.m.split('|');toast(n+' is not implemented yet – planned for Milestone '+m)});
$('oh').onclick=()=>{const o=$('ob');o.style.display=o.style.display=='none'?'block':'none'};

// ---------- camera controls ----------
const tgt=new THREE.Vector3(0,0,0);let yaw=.78,dist=60,pitch=.95;
function placeCam(){cam.position.set(tgt.x+Math.sin(yaw)*Math.cos(pitch)*dist,tgt.y+Math.sin(pitch)*dist,tgt.z+Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(tgt)}
const ptrs=new Map();let moved=0,pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size==2)pd=pdist()});
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(ptrs.size==1){moved+=Math.abs(dx)+Math.abs(dy);
  if(e.buttons&2||e.shiftKey){yaw-=dx*.005}else{const k=dist*.0018;
   tgt.x-=(Math.cos(yaw)*dx+Math.sin(yaw)*dy)*k;tgt.z-=(-Math.sin(yaw)*dx+Math.cos(yaw)*dy)*k}}
 p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size==2){const d=pdist();dist=Math.min(210,Math.max(14,dist*pd/d));pd=d;moved=99}
 clampT()});
const up=e=>{if(ptrs.has(e.pointerId)){ptrs.delete(e.pointerId);if(moved<6&&e.type=='pointerup'&&ptrs.size==0)click(e)}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(210,Math.max(14,dist*(1+Math.sign(e.deltaY)*.1)))},{passive:false});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function clampT(){const r=Math.hypot(tgt.x,tgt.z);if(r>130)tgt.multiplyScalar(130/r)}
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
function click(e){if(mv){moveTo(e);return}if(bm){placeAt(e);return}const r=cv.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v2,cam);
 const h=ray.intersectObjects(pick,true)[0];if(!h){sel(treeAt(e));return}let o=h.object;while(o&&!o.userData.name)o=o.parent;sel(o)}

// ---------- clock ----------
let speed=1,tmin=9*60;
const set=(s,id)=>{speed=s;['bp','b1','b2','b3'].forEach(i=>$(i).classList.toggle('on',i==id))};
$('bp').onclick=()=>set(0,'bp');$('b1').onclick=()=>set(1,'b1');$('b2').onclick=()=>set(3,'b2');$('b3').onclick=()=>set(8,'b3');

// ---------- minimap ----------
const mc=$('mmc').getContext('2d');
function minimap(){mc.fillStyle='#2f3a22';mc.fillRect(0,0,110,110);const P=(x,z)=>[55+x*.3,55+z*.3];
 mc.fillStyle='#444';mc.fillRect(0,P(0,ROADZ)[1]-2,110,4);
 pick.forEach(o=>{const[x,y]=P(o.position.x,o.position.z);mc.fillStyle=o.userData.tgt?'#fff':o.userData.name.startsWith('Ruin')?'#7a8a9a':o.userData.name.startsWith('Rock')?'#999':'#c8864a';mc.fillRect(x-1,y-1,o.userData.tgt?2:4,o.userData.tgt?2:4)});
 const[cx,cy]=P(tgt.x,tgt.z);mc.strokeStyle='#e8b84a';mc.strokeRect(cx-10,cy-10,20,20)}
